name: cscaa_taskmanager
description: "CSCAA Institutional Task Management and Legacy Tracking System."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

# File Picking for Submissions
  file_picker: ^8.0.1
  # Icons
  cupertino_icons: ^1.0.8

  # Firebase Core and Auth
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.1
  shared_preferences: ^2.2.3
  flutter_local_notifications: ^17.2.1

  # UI Components & Utilities
  table_calendar: ^3.1.2
  intl: ^0.19.0
  image_picker: ^1.0.7
  flutter_image_compress: ^2.1.0
  image: ^4.1.3
  firebase_messaging: ^15.2.10
  http: ^1.6.0
  permission_handler: ^12.0.1
  googleapis_auth: ^2.3.0
  flutter_background_service: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # If you have a logo image, uncomment the lines below 
  # and ensure the file exists in an 'assets' folder
  assets:
    - assets/logo.png
    - assets/service_account.json