name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main # Change to master if your default branch is named master

permissions:
  contents: read
  pages: write
  id-token: write

# This ensures that if you push code while a previous deployment is still running, 
# it cancels the old one instead of stacking up duplicate artifacts.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Step 1: Check out the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Clear any stuck artifacts from previous failed runs
      - name: Clean up old artifacts
        uses: actions/actions-clean@v2
        continue-on-error: true

      # Step 3: Set up Java environment (Required for Flutter Android/Web builders)
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Step 4: Install Flutter SDK
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # Step 5: Get Flutter packages
      - name: Install dependencies
        run: flutter pub get

      # Step 6: Build Flutter Web app
      - name: Build Web Application
        run: flutter build web --base-href "/${{ github.event.repository.name }}/" --release

      # Step 7: Upload the web build to GitHub Pages (Upgraded to v3 as required by modern runner standards)
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      # Step 8: Deploy to the live server
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
